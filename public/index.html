<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Studio — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d14;
    --panel: #12141c;
    --panel-2: #171a24;
    --border: #232635;
    --text: #e6e6f0;
    --text-dim: #8b8fa3;
    --accent: #7c5cff;
    --accent-soft: rgba(124,92,255,0.15);
    --live: #22d3c9;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* Top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:22px; height:22px;
    border-radius:6px;
    background: linear-gradient(135deg, var(--accent), var(--live));
    flex-shrink:0;
  }
  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.2px;
  }
  .live-badge{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:600;
    color: var(--live);
    background: rgba(34,211,201,0.1);
    border:1px solid rgba(34,211,201,0.3);
    padding:5px 12px;
    border-radius:20px;
  }
  .live-dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--live);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; box-shadow:0 0 0 0 rgba(34,211,201,0.5);}
    50%{ opacity:0.6; box-shadow:0 0 0 5px rgba(34,211,201,0);}
  }

  /* Barra de proyecto (nombre + guardar) */
  .project-bar{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #project-name{
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    width:160px;
    outline:none;
  }
  #project-name:focus{ border-color: var(--accent); }
  .btn{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:600;
    border:none;
    border-radius:6px;
    padding:7px 14px;
    cursor:pointer;
    transition: opacity 0.15s ease;
  }
  .btn:hover{ opacity:0.85; }
  .btn-primary{
    background: var(--accent);
    color: #fff;
  }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  #save-status{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--text-dim);
    min-width:90px;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:2px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .tab{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color: var(--text-dim);
    padding: 9px 16px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
    user-select:none;
  }
  .tab:hover{ color: var(--text); }
  .tab.active{
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  /* Main split */
  .main{
    flex:1;
    display:flex;
    min-height:0;
  }
  .editor-pane{
    flex:1;
    min-width:0;
    border-right: 1px solid var(--border);
  }
  .preview-pane{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background: var(--panel-2);
  }
  .preview-header{
    padding: 8px 16px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  #preview{
    flex:1;
    width:100%;
    border:none;
    background:#fff;
  }

  #monaco-container{
    width:100%;
    height:100%;
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">Code Studio</div>
    </div>
    <div class="project-bar">
      <input id="project-name" type="text" value="mi-juego" spellcheck="false" />
      <button class="btn btn-ghost" id="btn-load">Cargar</button>
      <button class="btn btn-primary" id="btn-save">Guardar</button>
      <span id="save-status"></span>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      VISTA EN VIVO
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-file="html">index.html</div>
    <div class="tab" data-file="css">style.css</div>
    <div class="tab" data-file="js">script.js</div>
  </div>

  <div class="main">
    <div class="editor-pane">
      <div id="monaco-container"></div>
    </div>
    <div class="preview-pane">
      <div class="preview-header">Vista previa</div>
      <iframe id="preview" sandbox="allow-scripts"></iframe>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
  // Contenido inicial de cada archivo
  const files = {
    html: {
      language: 'html',
      value: `<h1>¡Hola, juego!</h1>\n<p>Edita este archivo y mira cómo cambia la vista previa.</p>\n<canvas id="game" width="300" height="150"></canvas>`
    },
    css: {
      language: 'css',
      value: `body {\n  font-family: sans-serif;\n  text-align: center;\n  padding: 20px;\n}\ncanvas {\n  background: #222;\n  border-radius: 8px;\n}`
    },
    js: {
      language: 'javascript',
      value: `const canvas = document.getElementById('game');\nconst ctx = canvas.getContext('2d');\nlet x = 0;\n\nfunction loop() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  ctx.fillStyle = '#7c5cff';\n  ctx.fillRect(x, 60, 30, 30);\n  x = (x + 2) % canvas.width;\n  requestAnimationFrame(loop);\n}\nloop();`
    }
  };

  let currentFile = 'html';
  let editor;

  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {

    monaco.editor.defineTheme('studio-dark', {
      base: 'vs-dark',
      inherit: true,
      rules: [],
      colors: {
        'editor.background': '#0b0d14',
      }
    });

    editor = monaco.editor.create(document.getElementById('monaco-container'), {
      value: files[currentFile].value,
      language: files[currentFile].language,
      theme: 'studio-dark',
      fontFamily: 'JetBrains Mono, monospace',
      fontSize: 13,
      minimap: { enabled: false },
      automaticLayout: true,
      padding: { top: 16 }
    });

    editor.onDidChangeModelContent(() => {
      files[currentFile].value = editor.getValue();
      updatePreview();
    });

    updatePreview();
  });

  // Cambiar de pestaña
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFile = tab.dataset.file;
      editor.setValue(files[currentFile].value);
      monaco.editor.setModelLanguage(editor.getModel(), files[currentFile].language);
    });
  });

  // Combinar los 3 archivos y renderizar en el iframe
  function updatePreview() {
    const combined = `
      <html>
        <head><style>${files.css.value}</style></head>
        <body>
          ${files.html.value}
          <script>${files.js.value}<\/script>
        </body>
      </html>
    `;
    document.getElementById('preview').srcdoc = combined;
  }

  // Guarda cada uno de los 3 archivos del proyecto en GitHub, vía el backend.
  // Cada archivo recuerda su "sha" (una huella de GitHub) para poder actualizarlo sin conflictos.
  const fileMeta = { html: {}, css: {}, js: {} };
  const nameMap = { html: 'index.html', css: 'style.css', js: 'script.js' };

  async function guardarProyecto() {
    const status = document.getElementById('save-status');
    const project = document.getElementById('project-name').value.trim();
    if (!project) { status.textContent = 'Ponle nombre al proyecto'; return; }

    status.textContent = 'Guardando...';
    try {
      for (const key of ['html', 'css', 'js']) {
        const path = `${project}/${nameMap[key]}`;
        const res = await fetch('/api/file', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path,
            content: files[key].value,
            sha: fileMeta[key].sha || null
          })
        });
        const data = await res.json();
        if (data.sha) fileMeta[key].sha = data.sha;
      }
      status.textContent = 'Guardado ✓';
    } catch (e) {
      status.textContent = 'Error al guardar';
    }
    setTimeout(() => { status.textContent = ''; }, 2500);
  }

  // Carga los 3 archivos del proyecto desde GitHub
  async function cargarProyecto() {
    const status = document.getElementById('save-status');
    const project = document.getElementById('project-name').value.trim();
    if (!project) { status.textContent = 'Ponle nombre al proyecto'; return; }

    status.textContent = 'Cargando...';
    try {
      for (const key of ['html', 'css', 'js']) {
        const path = `${project}/${nameMap[key]}`;
        const res = await fetch(`/api/file?path=${encodeURIComponent(path)}`);
        const data = await res.json();
        files[key].value = data.content || '';
        fileMeta[key].sha = data.sha || null;
      }
      editor.setValue(files[currentFile].value);
      updatePreview();
      status.textContent = 'Cargado ✓';
    } catch (e) {
      status.textContent = 'Error al cargar';
    }
    setTimeout(() => { status.textContent = ''; }, 2500);
  }

  document.getElementById('btn-save').addEventListener('click', guardarProyecto);
  document.getElementById('btn-load').addEventListener('click', cargarProyecto);
</script>

</body>
</html>
